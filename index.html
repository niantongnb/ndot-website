<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Prototypes</title>
<meta name="theme-color" content="#050505">
<style>
  :root{
    --bg:#050505; --card:#101010; --text:#F5F5F2; --dim:#8A8A85;
    --pill:rgba(104,104,104,.82);
    --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);
       min-height:100svh;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1440px;margin-inline:auto;padding:clamp(20px,3vw,40px)}
  .top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;
       margin-bottom:clamp(20px,3vw,36px)}
  .top .label{font-family:var(--mono);font-size:11px;letter-spacing:.16em;
       text-transform:uppercase;color:var(--dim);margin:0}
  .grid{display:grid;gap:clamp(20px,2.6vw,36px)}
  @media (min-width:900px){ .grid{grid-template-columns:1fr 1fr} }

  .card{position:relative;border-radius:16px;overflow:hidden;background:var(--card);
        aspect-ratio:16/10;
        transition:transform .18s ease, box-shadow .18s ease}
  .card:hover{transform:translateY(-2px);box-shadow:0 10px 40px rgba(0,0,0,.55)}
  .card .frame{position:absolute;inset:0;overflow:hidden;background:#FAFAF8}
  /* the preview: a real desktop-width render of the site, scaled to the card */
  .card iframe{width:1440px;height:900px;border:0;transform-origin:0 0;
        pointer-events:none;display:block;background:#FAFAF8}
  .card .hit{position:absolute;inset:0;z-index:2}
  .card .pill{position:absolute;left:18px;bottom:16px;z-index:3;pointer-events:none;
        background:var(--pill);color:#fff;border-radius:999px;
        padding:8px 16px;font-size:15px;font-weight:500;letter-spacing:.01em;
        backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .meta{display:flex;justify-content:space-between;gap:12px;margin-top:12px}
  .meta p{margin:0;font-family:var(--mono);font-size:11px;letter-spacing:.08em;
        text-transform:uppercase;color:var(--dim)}
  a:focus-visible .card, .cardlink:focus-visible{outline:2px solid #fff;outline-offset:4px}
  .cardlink{display:block;color:inherit;text-decoration:none;border-radius:16px}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <p class="label">Prototype index</p>
    <p class="label">Two sites, two catalogs</p>
  </div>

  <div class="grid">

    <a class="cardlink" href="ndot/" aria-label="NDot AI — B2B growth platform for media companies. Open the NDot catalog.">
      <div class="card">
        <div class="frame">
          <iframe src="ndot/editorial/1/index.html" title="NDot AI preview" loading="eager" tabindex="-1" aria-hidden="true" scrolling="no"></iframe>
        </div>
        <span class="hit"></span>
        <span class="pill">NDot AI</span>
      </div>
      <div class="meta">
        <p>B2B · growth platform for media</p>
        <p>9 directions + deck</p>
      </div>
    </a>

    <a class="cardlink" href="nearby/" aria-label="Nearby AI — consumer local-life product. Open the Nearby catalog.">
      <div class="card">
        <div class="frame">
          <iframe src="nearby/v4/index.html" title="Nearby AI preview" loading="eager" tabindex="-1" aria-hidden="true" scrolling="no"></iframe>
        </div>
        <span class="hit"></span>
        <span class="pill">Nearby AI</span>
      </div>
      <div class="meta">
        <p>Consumer · local life</p>
        <p>4 directions</p>
      </div>
    </a>

  </div>

</div>
<script>
  // Scale each 1440px-wide preview down to its card. CSS alone cannot divide
  // lengths, so measure once per resize.
  const fit = () => {
    document.querySelectorAll('.card').forEach(card => {
      const f = card.querySelector('iframe');
      if (f) f.style.transform = 'scale(' + (card.clientWidth / 1440) + ')';
    });
  };
  new ResizeObserver(fit).observe(document.body);
  fit();
</script>
</body>
</html>
