<meta charset="utf-8">
<title>ndot paper grain</title>
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<canvas id="c" style="width:1280px;height:720px"></canvas>
<script>
/* The deck's paper tooth on its own. Same 90px seeded grit tile and the same
   alphas the pages use, drawn at dpr 2 so the grain lands at exactly the
   density of the slide plates. */
(function(){
  function mkRng(seed){ var s=(seed>>>0)||1; return function(){ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
  function gritTile(colour){
    var t = document.createElement('canvas'); t.width = t.height = 90;
    var c = t.getContext('2d');
    var img = c.createImageData(90, 90), d = img.data;
    var rr = parseInt(colour.slice(1,3),16), gg = parseInt(colour.slice(3,5),16), bb = parseInt(colour.slice(5,7),16);
    var q = mkRng(9173);
    for(var i = 0; i < d.length; i += 4){
      var v = q();
      d[i] = rr; d[i+1] = gg; d[i+2] = bb;
      d[i+3] = v > 0.76 ? Math.floor(v * 165) : 0;
    }
    c.putImageData(img, 0, 0);
    return t;
  }
  var V = {
    'paper':         { ground:'#FAFAF8', grit:'#6B6B63', alpha:0.20 },
    'ink':           { ground:'#131310', grit:'#FFFFFF', alpha:0.16 },
    'overlay-dark':  { ground:null,      grit:'#6B6B63', alpha:0.20 },
    'overlay-light': { ground:null,      grit:'#FFFFFF', alpha:0.16 },
    'tile-dark':     { ground:null,      grit:'#6B6B63', alpha:0.20, tile:true },
    'tile-light':    { ground:null,      grit:'#FFFFFF', alpha:0.16, tile:true }
  };
  var m = /v=([a-z-]+)/.exec(location.hash);
  var o = V[m ? m[1] : 'paper'] || V.paper;

  var cv = document.getElementById('c'), W = 1280, H = 720, dpr = 2;
  if(o.tile){ W = H = 90; dpr = 1; cv.style.width = cv.style.height = '90px'; }
  cv.width = W * dpr; cv.height = H * dpr;
  var ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if(o.ground){ ctx.fillStyle = o.ground; ctx.fillRect(0, 0, W, H); }
  ctx.globalAlpha = o.alpha;
  ctx.fillStyle = ctx.createPattern(gritTile(o.grit), 'repeat');
  ctx.fillRect(0, 0, W, H);
})();
</script>
